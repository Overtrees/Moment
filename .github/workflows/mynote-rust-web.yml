name: mynote-rust-web

# Rust Web 无浏览器门禁：cargo test + build + verify_rustweb.sh。
# 冒烟/探针需无头浏览器与本地服务编排，仍走本机/Simular Box 的
# run_all_tests.sh，不在本 workflow 内（批 13 P-D2 口径）。

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'scripts/verify_rustweb.sh'
      - 'run_all_tests.sh'
      - 'smoke-*.mjs'
      - 'probe_*.mjs'
      - '.github/workflows/mynote-rust-web.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'scripts/verify_rustweb.sh'
      - 'run_all_tests.sh'
      - 'smoke-*.mjs'
      - 'probe_*.mjs'
      - '.github/workflows/mynote-rust-web.yml'

jobs:
  test-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test (core + storage)
        working-directory: rust
        run: cargo test
      - name: install wasm-bindgen CLI (版本与 Cargo.lock 对齐)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: build web dist
        run: bash rust/apps/web/build.sh
      - name: verify rustweb（静态一致性 + 体积预算门）
        run: bash scripts/verify_rustweb.sh
