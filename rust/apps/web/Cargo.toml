[package]
name = "mynote-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# SQLite 存储后端（阶段二）：开启后 persist 门面走存储
# Worker（SAHPool SQLite），默认关 = IDB 直通、行为不变。
# 构建须同时置 MYNOTE_SQLITE=1 让 build.sh 产 Worker 资产。
sqlite-backend = []

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
mynote-core = { path = "../../crates/core" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "MediaQueryList", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url",
    "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbObjectStore", "IdbTransactionMode", "Event", "HtmlImageElement",
    "DomStringList", "DomException", "Storage", "Navigator", "Clipboard", "Response",
    "Node", "Range", "Selection", "CssStyleDeclaration",
    "EventTarget", "MutationObserver", "MutationObserverInit", "MutationRecord",
    "DomRect", "KeyboardEvent", "PointerEvent", "MouseEvent", "VisualViewport",
    "CompositionEvent", "ShareData", "FilePropertyBag",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent",
] }
