[package]
name = "mynote-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mynote-core = { path = "../core" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# rusqlite 0.40（SQLite 接入阶段一升级）：原生走 bundled C 构建；
# wasm32-unknown-unknown 走官方 ffi-sqlite-wasm-rs 集成
# （sqlite-wasm-rs 后端，该 feature 仅存在于 0.40+）。
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rusqlite = { version = "0.40", features = ["ffi-sqlite-wasm-rs"] }

[dev-dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
