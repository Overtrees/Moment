[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/ffi", "apps/web"]
default-members = ["crates/core", "crates/storage"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

# Lane T 实测量测后落码：fat LTO + 单 codegen-unit + strip 符号，
# 换 wasm 体积与运行速度（数字见调优回报）；代价是 release 构建
# 时间变长（本机量测一并记录）。panic 策略不动（wasm 侧默认即
# abort 语义，改动无收益且影响 unwind 口径，不碰）。
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# 原生 iOS 静态库专用：关 fat LTO（其 bitcode 与本机 lld 18
# 的 LLVM 版本不匹配、且静态库场景无收益），多 codegen-unit
# 提速；strip 保留（与 check-macho 的符号核查口径另行处理）。
[profile.ios]
inherits = "release"
lto = false
codegen-units = 16
